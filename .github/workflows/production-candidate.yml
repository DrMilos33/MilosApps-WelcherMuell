name: Production candidate

on:
  workflow_dispatch:
  push:
    branches:
      - codex/waste-guide-same-host-production
      - codex/waste-guide-canonical-cutover

permissions:
  contents: read

concurrency:
  group: waste-guide-production-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  official-sources:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify official sources online or current immutable evidence
        run: |
          set +e
          node scripts/check-sources.mjs
          source_status=$?
          set -e

          if [ "$source_status" -eq 0 ]; then
            exit 0
          fi

          if [ "$source_status" -ne 2 ]; then
            echo "Online source verification failed with a final HTTP error; prior evidence is forbidden."
            exit "$source_status"
          fi

          node scripts/verify-source-evidence-reuse.mjs

  full-gate:
    needs: official-sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WASTE_GUIDE_SOURCE_COMMIT: ${{ github.sha }}
      WASTE_GUIDE_PRODUCTION_URL: https://milos-apps.de/welcher-muell
      WASTE_GUIDE_CLOUDFLARE_TARGET_CONFIRMED: "1"
      WASTE_GUIDE_PRODUCTION_SOURCE_BRANCH: codex/waste-guide-same-host-production
      WASTE_GUIDE_FEEDBACK_ENDPOINT: https://milosapps-waste-guide-feedback-production.pascalcasiddu.workers.dev/v1/feedback
      WASTE_GUIDE_LEGACY_REDIRECT_SOURCE_BRANCH: codex/waste-guide-canonical-cutover
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:shell
      - run: pnpm test:essentials
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build:cloudflare:production
      - run: pnpm test:production:artifact
      - run: pnpm test:e2e:production
      - run: pnpm build:cloudflare:legacy-redirect
      - run: pnpm test:production:legacy-redirect
      - uses: actions/upload-artifact@v4
        with:
          name: waste-guide-production-candidate-${{ github.sha }}
          path: dist/production
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: waste-guide-production-legacy-redirect-${{ github.sha }}
          path: dist/production-legacy-redirect
          if-no-files-found: error
          retention-days: 7
